name: CI

on:
  push:
  pull_request:

jobs:
  padelsim:
    # O motor puro, fora do Unreal, contra o gabarito do Padel.Core — tolerância zero, nos três compiladores. O MSVC é
    # o do Unreal no Windows; gcc e clang, o do Linux e do Steam Deck. Desde 14/10 o motor não usa a libm
    # (padel::mat, porte de MatematicaDeterministica.cs): o resultado é o mesmo em qualquer máquina, e o
    # TestesDaMatematica barra a libm de voltar.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, nome: gcc }
          - { os: ubuntu-latest, nome: clang, cxx: clang++ }
          - { os: windows-latest, nome: msvc }
    runs-on: ${{ matrix.os }}
    name: PadelSim (${{ matrix.nome }})
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --config Release
      - name: Testar
        run: ctest --test-dir build -C Release --output-on-failure
