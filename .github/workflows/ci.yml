name: CI

on:
  push:
  pull_request:

jobs:
  padelsim:
    # O motor puro, fora do Unreal, contra o gabarito do Padel.Core — tolerância zero.
    # Linux fixo na 24.04: o gabarito saiu da glibc 2.39, e a IA e os golpes especiais usam logf/cosf/sinf/expf/powf/
    # atan2f, que mudam de bits entre versões da glibc (ver CLAUDE.md). Trocar a versão = regerar o gabarito junto.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, nome: gcc }
          - { os: ubuntu-24.04, nome: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    name: PadelSim (${{ matrix.nome }})
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --config Release
      - name: Testar
        run: ctest --test-dir build -C Release --output-on-failure

  msvc:
    # O compilador do Unreal no Windows. Bloqueia: compilar sem aviso (/W4 /WX) e o que não usa libm — a física da
    # bola, o PassoFixo, o placar e o árbitro, bit a bit. A UCRT da Microsoft calcula sin/cos/log/exp/pow diferente da glibc; por isso as
    # partidas e os golpes especiais rodam num passo à parte, só informativo, até o Padel.Core trocar essas funções
    # por versões próprias (decisão pendente, docs/estado-atual.md).
    runs-on: windows-latest
    name: PadelSim (msvc)
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --config Release
      - name: Testar (sem libm)
        run: ctest --test-dir build -C Release --output-on-failure -R "TestesDoPadelSim|TestesDoPassoFixo|TestesDoPlacarEDoArbitro"
      - name: Testar (com libm, informativo)
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure -R "TestesDosGolpesEspeciais|TestesDaPartida"
